<main class="item-form-page fade-in">
  <header class="page-header">
    <div>
      <p>{{ isEditing ? '编辑菜品' : '新建菜品' }}</p>
      <h1>{{ isEditing ? form.name : '添加一道菜' }}</h1>
    </div>
    <a routerLink="/menu" class="toolbar-button">返回列表</a>
  </header>

  <section class="form-shell panel">
    <form class="item-form" (ngSubmit)="save()">
      <label>
        <span>名称</span>
        <input name="name" [(ngModel)]="form.name" (ngModelChange)="markDirty()" maxlength="40" required>
      </label>
      <label>
        <span>描述（200 字内）</span>
        <textarea name="description" [(ngModel)]="form.description" (ngModelChange)="markDirty()" maxlength="200" rows="5"></textarea>
      </label>
      <div class="grid-two">
        <label>
          <span>价格</span>
          <input type="number" name="price" [(ngModel)]="form.price" (ngModelChange)="markDirty()" min="0" step="0.01">
        </label>
        <label>
          <span>分类</span>
          <select name="categoryId" [(ngModel)]="form.categoryId" (ngModelChange)="markDirty()">
            <option value="">未分类</option>
            <option *ngFor="let category of categories$ | async" [value]="category.id">{{ category.icon }} {{ category.name }}</option>
          </select>
        </label>
      </div>
      <div class="grid-two">
        <label>
          <span>辣度</span>
          <select name="spiceLevel" [(ngModel)]="form.spiceLevel" (ngModelChange)="markDirty()">
            <option *ngFor="let option of spiceOptions" [value]="option.value">{{ option.label }}</option>
          </select>
        </label>
        <label>
          <span>上传图片</span>
          <input type="file" accept="image/*" (change)="onFileSelected($event)">
        </label>
      </div>
      <div class="checks">
        <label>
          <input type="checkbox" name="isRecommended" [(ngModel)]="form.isRecommended" (ngModelChange)="markDirty()">
          <span>推荐菜</span>
        </label>
        <label>
          <input type="checkbox" name="isVegetarian" [(ngModel)]="form.isVegetarian" (ngModelChange)="markDirty()">
          <span>素食</span>
        </label>
      </div>
      <fieldset class="spec-section">
        <legend>
          <span>规格管理</span>
          <button type="button" class="add-spec" (click)="addSpecification()">+ 添加规格</button>
        </legend>
        <p class="spec-hint" *ngIf="form.specifications.length === 0">未设置规格时，将展示统一价格。</p>
        <div class="spec-list" *ngIf="form.specifications.length > 0">
          <div *ngFor="let spec of form.specifications; let i = index; trackBy: trackBySpecIndex" class="spec-row">
            <input
              type="text"
              [value]="spec.name"
              (input)="updateSpecification(i, 'name', $any($event.target).value)"
              placeholder="规格名称"
              maxlength="20"
            >
            <input
              type="number"
              [value]="spec.price"
              (input)="updateSpecification(i, 'price', $any($event.target).value)"
              placeholder="价格"
              min="0"
              step="0.01"
            >
            <button type="button" class="remove-spec" (click)="removeSpecification(i)">×</button>
          </div>
        </div>
      </fieldset>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <button type="submit" class="toolbar-button primary">{{ isEditing ? '保存修改' : '创建菜品' }}</button>
    </form>

    <aside class="preview-card">
      <div class="image-preview" [class.with-image]="hasImage">
        <img *ngIf="hasImage" [src]="form.image" [alt]="form.name || '菜品图片'">
        <span *ngIf="!hasImage">{{ imageIcon }}</span>
      </div>
      <h2>{{ form.name || '菜品名称' }}</h2>
      <p>{{ form.description || '菜品描述会显示在这里。' }}</p>
      <strong *ngIf="form.specifications.length === 0">{{ pricePreview }}</strong>
      <div *ngIf="form.specifications.length > 0" class="preview-specs">
        <div *ngFor="let spec of form.specifications; let i = index; trackBy: trackBySpecIndex" class="preview-spec">
          <span>{{ spec.name || '规格' + (i + 1) }}</span>
          <strong>¥{{ (spec.price || 0).toFixed(2) }}</strong>
        </div>
      </div>
    </aside>
  </section>
</main>
