<div *ngIf="open" class="dialog-backdrop" role="presentation">
  <section class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <div class="actions">
      <button type="button" class="toolbar-button" (click)="cancel.emit()">{{ cancelLabel }}</button>
      <button type="button" class="toolbar-button primary danger" (click)="confirm.emit()">{{ confirmLabel }}</button>
    </div>
  </section>
</div>
